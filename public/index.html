<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero FutBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232a78d6' stroke-width='3'/%3E%3Cpath d='M16 2v28M2 16h28' stroke='%232a78d6' stroke-width='2' opacity='.35'/%3E%3C/svg%3E">
</head>
<body>

<header class="top">
  <div class="top__brand">FutBot <span>· tablero de sprint</span></div>
  <div class="top__spacer"></div>
  <div class="clock" id="clock"></div>
  <button id="live" class="live" type="button" aria-live="polite"></button>
  <button id="refresh" type="button">Actualizar</button>
</header>

<main id="app">
  <div class="state"><h2>Trayendo datos de Jira…</h2><p>Primera carga: unos segundos.</p></div>
</main>

<div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>

<script type="module" src="app.js"></script>
</body>
</html>
